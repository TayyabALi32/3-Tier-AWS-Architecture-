name: Build and Push 3-Tier Docker App

# 1. Trigger rule: Runs automatically on every git push to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    # Step 2: Download your repository code into the GitHub Actions runner
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 3: Log into Docker Hub using your secure GitHub Secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 4: Build and push the Backend (Tier 2) image to Docker Hub
    - name: Build and push Backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/three-tier-backend:latest
