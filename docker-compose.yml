services:
  # ----------------------------------------
  # TIER 3: Database Service (PostgreSQL)
  # ----------------------------------------
  db:
    image: postgres:15-alpine
    container_name: tier3-db
    restart: always
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net

  # ----------------------------------------
  # TIER 2: Application Backend (Flask)
  # ----------------------------------------
  backend:
    build: ./backend
    container_name: tier2-backend
    restart: always
    environment:
      DB_HOST: db
      POSTGRES_DB: appdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    depends_on:
      - db
    networks:
      - frontend-net
      - backend-net

  # ----------------------------------------
  # TIER 1: Web & Reverse Proxy (Nginx)
  # ----------------------------------------
  frontend:
    image: nginx:alpine
    container_name: tier1-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - frontend-net

# ----------------------------------------
# Virtual Networks for Tier Isolation
# ----------------------------------------
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

# ----------------------------------------
# Persistent Storage for Database
# ----------------------------------------
volumes:
  pgdata:
